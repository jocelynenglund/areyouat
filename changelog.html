<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="changelog_page_title">Är du på? — ändringar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital,wght@0,400;1,400&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/lib/base.css">
  <link rel="stylesheet" href="/lib/scandi.css">
  <link rel="stylesheet" href="/slices/friend/i18n/slice.css">
  <style>
    .cl-screen {
      padding: 32px 28px 48px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      flex: 1;
    }
    .cl-heading {
      font-family: var(--font-display);
      font-size: 52px;
      line-height: 1.02;
      letter-spacing: -2px;
      color: var(--ink);
    }
    .cl-heading .italic { font-style: italic; }
    .cl-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .cl-day-heading {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--ink-soft);
      text-transform: uppercase;
      padding-top: 16px;
    }
    .cl-entry {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 4px 0;
    }
    .cl-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      flex-shrink: 0;
      margin-top: 2px;
      min-width: 60px;
      text-align: center;
    }
    .cl-badge--feature { background: #E6F4EA; color: #1E6E3A; }
    .cl-badge--fix { background: #FEF3C7; color: #92400E; }
    .cl-badge--refactor { background: #DBEAFE; color: #1E3A8A; }
    .cl-badge--update { background: #EDE9FE; color: #5B21B6; }
    .cl-msg {
      font-size: 15px;
      line-height: 1.45;
      color: var(--ink);
      flex: 1;
    }
    .cl-loading, .cl-error {
      font-size: 14px;
      color: var(--ink-soft);
      font-style: italic;
    }
    .cl-back {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
      padding-top: 8px;
    }
    .cl-back:hover { color: var(--ink-soft); }
  </style>
</head>
<body>
  <div id="app">
    <div class="scandi-screen">
      <div class="scandi-chrome">
        <a class="brand-mark" href="/about" aria-label="about">
          <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
            <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
            <circle cx="16" cy="16" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
            <circle cx="16" cy="16" r="4" fill="currentColor"/>
          </svg>
        </a>
        <div class="lang-switcher"></div>
      </div>

      <div class="cl-screen">
        <div class="cl-heading">
          <span class="italic" data-i18n="changelog_heading">vad är nytt?</span>
        </div>

        <div id="cl-list" class="cl-list">
          <div class="cl-loading" data-i18n="loading">kollar…</div>
        </div>

        <a class="cl-back" href="/" data-i18n="about_back">← tillbaka</a>
      </div>
    </div>
  </div>
  <script src="/slices/friend/i18n/i18n.js"></script>
  <script>
    (function () {
      const labelFor = (type) => {
        const key = 'cl_type_' + type;
        return (I18N && I18N.t) ? I18N.t(key) : type;
      };

      fetch('/changelog.json', { cache: 'no-cache' })
        .then((r) => r.json())
        .then((data) => {
          const list = document.getElementById('cl-list');
          const commits = data.commits || [];
          if (!commits.length) {
            list.innerHTML = '<div class="cl-error">inga ändringar att visa</div>';
            return;
          }

          const groups = {};
          commits.forEach((c) => {
            if (!groups[c.date]) groups[c.date] = [];
            groups[c.date].push(c);
          });

          const dates = Object.keys(groups).sort((a, b) => b.localeCompare(a));
          const locale = (I18N && I18N.t) ? I18N.t('date_locale') : 'sv-SE';

          list.innerHTML = dates.map((date) => {
            const d = new Date(date + 'T00:00:00');
            const dateStr = d.toLocaleDateString(locale, { day: 'numeric', month: 'short', year: 'numeric' });
            const entries = groups[date].map((c) => `
              <div class="cl-entry">
                <span class="cl-badge cl-badge--${c.type}">${labelFor(c.type)}</span>
                <div class="cl-msg">${escapeHtml(c.displayMessage)}</div>
              </div>
            `).join('');
            return `
              <div class="cl-day">
                <div class="cl-day-heading">${dateStr}</div>
                ${entries}
              </div>
            `;
          }).join('');
        })
        .catch(() => {
          document.getElementById('cl-list').innerHTML =
            '<div class="cl-error">kunde inte ladda ändringar</div>';
        });

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }
    })();
  </script>
</body>
</html>
